<!-- Supabase → Authentication → Emails → "Magic Link" ve "Confirm signup" şablonlarının ikisine de yapıştırılır.
     Konu: Tribün giriş kodun: {{ .Token }}
     Kod her cihazda çalışır; bağlantı telefonda uygulamayı açar (tribunapp.io/giris → uygulama). -->
<div style="margin:0;padding:32px 16px;background:#E9E7F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <div style="max-width:440px;margin:0 auto;background:#121A44;border-radius:24px;padding:32px 28px;color:#ffffff;text-align:center">
    <div style="font-size:15px;font-weight:700;letter-spacing:.5px;color:#9DB1FF">TRİBÜN</div>
    <h1 style="margin:14px 0 8px;font-size:22px;line-height:1.3;color:#ffffff">Giriş kodun</h1>
    <p style="margin:0 0 20px;font-size:14px;line-height:1.5;color:#A7ABC8">Uygulamada bu kodu yaz:</p>
    <div style="display:inline-block;padding:14px 22px;border-radius:16px;background:rgba(255,255,255,.08);font-size:34px;font-weight:700;letter-spacing:8px;color:#ffffff">{{ .Token }}</div>
    <p style="margin:22px 0 14px;font-size:14px;line-height:1.5;color:#A7ABC8">ya da telefonundan bu düğmeye dokun:</p>
    <a href="https://tribunapp.io/giris?h={{ .TokenHash }}" style="display:inline-block;padding:14px 26px;border-radius:14px;background:#9DB1FF;color:#0B1030;font-size:16px;font-weight:700;text-decoration:none">Tribün'e giriş yap</a>
    <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#7F84A8">Kod 1 saat geçerli. Bu e-postayı sen istemediysen görmezden gelebilirsin.</p>
  </div>
</div>
